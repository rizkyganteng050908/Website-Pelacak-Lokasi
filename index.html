<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokasi Keluarga</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --text:#1f1f1f; --muted:#6b6b6b;
    --accent:#2f6f4f; --accent-text:#fff; --border:#e5e3df;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17181a; --card:#212225; --text:#f0f0ee; --muted:#9a9a97; --accent:#4caf7d; --accent-text:#0b0b0b; --border:#33343a; }
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);}
  .wrap{max-width:720px; margin:0 auto; padding:20px 16px 40px;}
  h1{font-size:20px; margin:0 0 4px;}
  p.sub{color:var(--muted); margin:0 0 16px; font-size:14px;}
  .row{display:flex; gap:8px; margin-bottom:12px;}
  input{flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px;}
  button{padding:12px 16px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-text); font-weight:600; font-size:14px; cursor:pointer;}
  button:disabled{opacity:.5;}
  #map{width:100%; height:360px; border-radius:14px; margin:12px 0; border:1px solid var(--border);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .member{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .member:last-child{border-bottom:none;}
  .muted{color:var(--muted); font-size:12px;}
  .status{font-size:13px; color:var(--muted); min-height:18px; margin-top:6px;}
  .setup{background:#fff3cd; color:#664d03; border-radius:10px; padding:12px; font-size:13px; margin-bottom:16px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📍 Lokasi Keluarga</h1>
  <p class="sub">Setiap anggota membagikan lokasinya sendiri secara sukarela.</p>

  <div id="setupWarning" class="setup" style="display:none">
    ⚠️ Firebase belum dikonfigurasi. Isi <code>firebaseConfig</code> di bagian bawah file HTML ini (lihat komentar di source code untuk langkah-langkahnya).
  </div>

  <div id="loginBox" class="card" style="margin-bottom:12px;">
    <div class="row">
      <input id="phoneInput" placeholder="Nomor HP (contoh: +6281234567890)" />
      <button id="sendOtpBtn">Kirim OTP</button>
    </div>
    <div class="row" id="otpRow" style="display:none;">
      <input id="otpInput" placeholder="Kode OTP dari SMS" />
      <button id="verifyOtpBtn">Verifikasi</button>
    </div>
    <div id="recaptcha-container"></div>
  </div>

  <div class="row" id="shareRow" style="display:none;">
    <button id="shareBtn" style="flex:1;">Bagikan lokasi saya</button>
    <button id="logoutBtn" style="flex:0 0 auto; background:transparent; color:var(--muted); border:1px solid var(--border);">Keluar</button>
  </div>
  <div class="status" id="status"></div>

  <div id="map"></div>

  <div class="card">
    <div id="list" class="muted">Memuat anggota keluarga…</div>
  </div>
</div>

<script>
/* =========================================================
   1) KONFIGURASI FIREBASE — WAJIB DIISI
   =========================================================
   Langkah membuat Firebase (gratis, ~5 menit):
   1. Buka https://console.firebase.google.com -> Buat project baru
   2. Di sidebar: Build -> Realtime Database -> Create Database
      -> pilih mode "Test mode" untuk mulai (nanti bisa diperketat)
   3. Di sidebar: Project settings (ikon gerigi) -> scroll ke "Your apps"
      -> klik ikon "</>" (Web) -> daftar aplikasi -> copy "firebaseConfig"
   4. Paste firebaseConfig itu menggantikan placeholder di bawah ini
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAdGEff51-ASVDvsCJWohKerGsrOf-IkbA",
  authDomain: "lokasi-akurat.firebaseapp.com",
  databaseURL: "https://lokasi-akurat-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lokasi-akurat",
  storageBucket: "lokasi-akurat.firebasestorage.app",
  messagingSenderId: "790752792376",
  appId: "1:790752792376:web:e5fcdef6448aa674c07bcd"
};

/* =========================================================
   2) GOOGLE MAPS API KEY — sudah diisi
   ========================================================= */
const GOOGLE_MAPS_API_KEY = "AIzaSyCQup31nEXBYPRdCch07L6jaJtgChp7zA4";

/* ========================================================= */

let map, markers = {};
let myUid = null, myPhone = null;

const isFirebaseConfigured = !firebaseConfig.apiKey.startsWith("ISI_");
if(!isFirebaseConfigured){
  document.getElementById("setupWarning").style.display = "block";
}

// --- Load Google Maps script dynamically ---
function loadGoogleMaps(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.maps){ resolve(); return; }
    const script = document.createElement("script");
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=__gmapsLoaded`;
    window.__gmapsLoaded = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: -2.5, lng: 118 }, // tengah Indonesia sebagai default
    zoom: 5
  });
}

function upsertMarker(id, data){
  const pos = { lat: data.lat, lng: data.lng };
  if(markers[id]){
    markers[id].setPosition(pos);
    markers[id].setTitle(data.phone || id);
  } else {
    markers[id] = new google.maps.Marker({
      position: pos, map, title: data.phone || id
    });
  }
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "baru saja";
  if(s<3600) return Math.floor(s/60)+" menit lalu";
  if(s<86400) return Math.floor(s/3600)+" jam lalu";
  return Math.floor(s/86400)+" hari lalu";
}

function renderList(allData){
  const listEl = document.getElementById("list");
  const entries = Object.entries(allData || {});
  if(entries.length===0){
    listEl.textContent = "Belum ada yang membagikan lokasi.";
    return;
  }
  listEl.innerHTML = entries
    .sort((a,b)=> (b[1].timestamp||0)-(a[1].timestamp||0))
    .map(([id,d])=>{
      const you = id===myUid ? " (Anda)" : "";
      return `<div class="member"><span>${d.phone||id}${you}</span><span class="muted">${timeAgo(d.timestamp)}</span></div>`;
    }).join("");
}

// --- Firebase (via CDN, loaded lazily so Maps keeps working even without it) ---
let db, auth, authModule, dbModule, confirmationResult, recaptchaVerifier;

async function loadFirebase(){
  if(!isFirebaseConfigured) return null;
  const appModule = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  authModule = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
  dbModule = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

  const app = appModule.initializeApp(firebaseConfig);
  auth = authModule.getAuth(app);
  db = dbModule.getDatabase(app);

  authModule.onAuthStateChanged(auth, (user)=>{
    if(user){
      myUid = user.uid;
      myPhone = user.phoneNumber;
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("shareRow").style.display = "flex";
      subscribeLocations();
    } else {
      myUid = null; myPhone = null;
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("shareRow").style.display = "none";
    }
  });
}

function subscribeLocations(){
  dbModule.onValue(dbModule.ref(db, "locations"), (snapshot)=>{
    const data = snapshot.val() || {};
    Object.entries(data).forEach(([id,d])=> upsertMarker(id, d));
    renderList(data);
  });
}

function setupRecaptcha(){
  if(recaptchaVerifier) return recaptchaVerifier;
  recaptchaVerifier = new authModule.RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" });
  return recaptchaVerifier;
}

async function sendOtp(){
  const statusEl = document.getElementById("status");
  const phone = document.getElementById("phoneInput").value.trim();
  if(!phone.startsWith("+")){
    statusEl.textContent = "Gunakan format internasional, contoh: +6281234567890";
    return;
  }
  if(!isFirebaseConfigured){ statusEl.textContent = "Firebase belum dikonfigurasi."; return; }
  document.getElementById("sendOtpBtn").disabled = true;
  statusEl.textContent = "Mengirim kode OTP…";
  try{
    const verifier = setupRecaptcha();
    confirmationResult = await authModule.signInWithPhoneNumber(auth, phone, verifier);
    document.getElementById("otpRow").style.display = "flex";
    statusEl.textContent = "Kode OTP dikirim via SMS. Masukkan kodenya.";
  }catch(e){
    statusEl.textContent = "Gagal kirim OTP: " + e.message;
  }
  document.getElementById("sendOtpBtn").disabled = false;
}

async function verifyOtp(){
  const statusEl = document.getElementById("status");
  const code = document.getElementById("otpInput").value.trim();
  if(!code || !confirmationResult){ statusEl.textContent = "Masukkan kode OTP dulu."; return; }
  document.getElementById("verifyOtpBtn").disabled = true;
  statusEl.textContent = "Memverifikasi…";
  try{
    await confirmationResult.confirm(code);
    statusEl.textContent = "Berhasil masuk ✓";
  }catch(e){
    statusEl.textContent = "Kode salah atau kadaluarsa: " + e.message;
  }
  document.getElementById("verifyOtpBtn").disabled = false;
}

async function shareLocation(){
  const statusEl = document.getElementById("status");
  if(!myUid){ statusEl.textContent = "Anda belum login."; return; }
  if(!navigator.geolocation){ statusEl.textContent = "Browser tidak mendukung geolokasi."; return; }

  document.getElementById("shareBtn").disabled = true;
  statusEl.textContent = "Meminta izin lokasi…";

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const data = {
      phone: myPhone,
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      timestamp: Date.now()
    };
    try{
      await dbModule.set(dbModule.ref(db, "locations/"+myUid), data);
      statusEl.textContent = "Lokasi dibagikan ✓";
      upsertMarker(myUid, data);
      map.setCenter({ lat: data.lat, lng: data.lng });
      map.setZoom(13);
    }catch(e){
      statusEl.textContent = "Gagal menyimpan: " + e.message;
    }
    document.getElementById("shareBtn").disabled = false;
  }, (err)=>{
    statusEl.textContent = "Izin lokasi ditolak/gagal: " + err.message;
    document.getElementById("shareBtn").disabled = false;
  }, { enableHighAccuracy:true, timeout:10000 });
}

document.getElementById("sendOtpBtn").addEventListener("click", sendOtp);
document.getElementById("verifyOtpBtn").addEventListener("click", verifyOtp);
document.getElementById("shareBtn").addEventListener("click", shareLocation);
document.getElementById("logoutBtn").addEventListener("click", ()=> authModule.signOut(auth));

(async function start(){
  await loadGoogleMaps();
  initMap();
  await loadFirebase();
})();
</script>
</body>
</html>
